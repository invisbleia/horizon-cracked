name: Release Launcher
# Builds the launcher on Linux, macOS, Windows x64 and ARM64, and releases it by itself (docs/release-flow.md): after a
# push to main that changes the launcher or a crate it builds in (the paths below),
# every 10 minutes (a release waiting for merges to settle goes out) and by hand, tools/release_train.py decides as
# for the game.
# A release is launcher@X.Y.Z on the line in .github/launcher-release-line.txt (docs/versioning.md); without it
# launcher-vX.Y.Z, the patch after the last launcher tag or the next minor when a merged pull request is labelled
# feature. The version and the tag are given to the build (HORIZON_LAUNCHER_VERSION, HORIZON_LAUNCHER_TAG): no bump
# commits.
# Never marked latest. Pushes to launcher branches only build. RELEASES_PAUSED=1 stops releases.
# Linux ships two archives of one binary: the .tar.gz the launcher updates itself from, and an
# AppImage (packaging/linux/appimage.sh) for players without a distribution package, which replaces
# itself instead (launcher/src/backend.rs).
# macOS: Apple Silicon, and Intel cross-built for x86_64-apple-darwin on the same runner, its tests and smoke test
# under Rosetta 2 (#1161). With the repository variable MACOS_SIGN_IDENTITY set, Horizon.app and the .dmg are signed with
# Developer ID, notarized and stapled, from the runner's signing keychain (packaging/macos/README.md);
# unset (forks), they are signed ad hoc.
# Windows ships each architecture's launcher in its ZIP (what a launcher updates itself from) and as
# horizon-launcher-setup.exe or horizon-launcher-setup-arm64.exe, which opens the per-user installer instead of Home
# (launcher/src/installer.rs).
#   gh workflow run "Release Launcher" --ref main -f test_only=true  # tests only; no release build
#   gh workflow run "Release Launcher" --ref main -f force=true      # build and publish now; no tests

on:
  push:
    branches: [main, launcher, 'launcher-*']
    paths:
      # Everything the launcher is built and packaged from, as tools/release_train.py's LAUNCHER_PATHS.
      - 'launcher/**'
      - 'crates/horizon-bench/**'
      - 'crates/horizon-friends/**'
      - 'crates/horizon-mcp/**'
      - 'crates/horizon-mods/**'
      - 'crates/horizon-port-pack/**'
      - 'crates/horizon-prepare/**'
      - 'crates/horizon-release-sign/**'
      - 'crates/horizon-telemetry/**'
      - 'crates/horizon-theme/**'
      - 'packaging/linux/**'
      - 'packaging/icons/**'
      - '.github/workflows/releaselauncher.yml'
      - '.github/launcher-release-line.txt'
      - 'tools/release_train.py'
  schedule:
    - cron: '7-59/10 * * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: Run the launcher test suite only; do not build release assets or publish
        type: boolean
        default: false
      force:
        description: Build and publish a release now without running tests
        type: boolean
        default: false
      added:
        description: Optional Added section; blank keeps the automatic pull request list
        type: string
        required: false
      removed:
        description: Changes removed in this release; blank says none were specified
        type: string
        required: false
      fixed:
        description: Optional Fixed section; blank keeps the automatic pull request list
        type: string
        required: false
      build_linux:
        description: Build Linux (x86_64)
        type: boolean
        default: true
      build_macos:
        description: Build macOS (Apple Silicon)
        type: boolean
        default: true
      build_macos_x64:
        description: Build macOS (Intel)
        type: boolean
        default: true
      build_windows:
        description: Build Windows (x64)
        type: boolean
        default: true
      build_windows_arm64:
        description: Build Windows (ARM64)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref == 'refs/heads/main' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # Platform builds, picked by hand (workflow_dispatch) or all of them on pushes and the schedule.
  BUILD_LINUX: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_linux && 'true' || 'false') }}
  BUILD_MACOS: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_macos && 'true' || 'false') }}
  BUILD_MACOS_X64: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_macos_x64 && 'true' || 'false') }}
  BUILD_WINDOWS: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_windows && 'true' || 'false') }}
  BUILD_WINDOWS_ARM64: ${{ github.event_name != 'workflow_dispatch' && 'true' || (inputs.build_windows_arm64 && 'true' || 'false') }}

jobs:
  decide:
    if: ${{ inputs.test_only != true || inputs.force == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.decide.outputs.release }}
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      head: ${{ steps.decide.outputs.head }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
          # Branch builds and forced releases use their selected commit; normal main releases use the newest
          # commit with green checks.
          HEAD_SHA: ${{ (github.ref != 'refs/heads/main' || inputs.force) && github.sha || '' }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
        run: |
          python3 tools/release_train.py decide --kind launcher ${HEAD_SHA:+--head "$HEAD_SHA"} ${FORCE:+--force} | tee decision.json
          echo "### $(jq -r '.reason' decision.json)" >> "$GITHUB_STEP_SUMMARY"
          tag=$(jq -r '.tag' decision.json)
          version=${tag#launcher-v}
          echo "version=${version#launcher@}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" != refs/heads/main ]]; then
            # Builds from launcher branches are useful for validation, but never publish a release.
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=$(jq -r '.release' decision.json)" >> "$GITHUB_OUTPUT"
          fi

  test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only == true && inputs.force != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries GPUI links to
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - name: Test launcher
        run: cargo test --release --locked

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true' &&
        (matrix.name != 'linux' || env.BUILD_LINUX == 'true') &&
        (matrix.name != 'macos' || env.BUILD_MACOS == 'true') &&
        (matrix.name != 'macos-x64' || env.BUILD_MACOS_X64 == 'true') &&
        (matrix.name != 'windows' || env.BUILD_WINDOWS == 'true') &&
        (matrix.name != 'windows-arm64' || env.BUILD_WINDOWS_ARM64 == 'true')
    name: build ${{ matrix.name }}
    # Start every platform build together (a workflow dispatch may unselect any of them). Only the
    # optional Windows ARM64 build may fail without blocking the release; macOS assets are required,
    # so a failed Mac build must stop publishing. An unselected platform is simply not built: the
    # release's build list says so, and its launchers stay on their version until it ships.
    continue-on-error: ${{ matrix.name == 'windows-arm64' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
          - name: macos
            mac: true
            asset: horizon-launcher-macos-arm64.zip
            binary: horizon-launcher
            mac_arch: arm64
          - name: macos-x64
            mac: true
            target: x86_64-apple-darwin
            asset: horizon-launcher-macos-x64.zip
            binary: horizon-launcher
            mac_arch: x64
          - name: windows
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            pe_arch: x64
            setup_asset: horizon-launcher-setup.exe
            # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll,
            # which only the Visual C++ redistributable installs.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: horizon-launcher-windows-arm64.zip
            binary: horizon-launcher.exe
            pe_arch: arm64
            setup_asset: horizon-launcher-setup-arm64.exe
            # The C runtime linked in, so the standalone ARM64 launcher needs no redistributable.
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.name == 'windows-arm64' && (vars.WINDOWS_ARM_RUNNER || 'windows-11-vs2026-arm') || matrix.mac && 'macos-latest' || matrix.os }}
    # Notarizing the app and then the .dmg can take a few minutes each.
    timeout-minutes: ${{ matrix.mac && 60 || 40 }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # Where cargo puts the launcher: target/release, or target/<target>/release for another target.
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
      # Horizon's Azure app for Microsoft sign-in (docs/microsoft-account.md): a repository
      # variable, not a secret. Unset, the launcher says sign-in is not configured.
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      # The mod browser's CurseForge source (docs/mod-browser.md#curseforge): a repository secret. Unset, the
      # launcher searches Modrinth only.
      HORIZON_CURSEFORGE_API_KEY: ${{ secrets.HORIZON_CURSEFORGE_API_KEY }}
      # The release's version and tag, built in (launcher/src/backend.rs VERSION and own_tag: the tag says which
      # line it is on, docs/versioning.md); a launcher branch's build keeps Cargo.toml's.
      HORIZON_LAUNCHER_VERSION: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && needs.decide.outputs.version || '' }}
      HORIZON_LAUNCHER_TAG: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main') && needs.decide.outputs.tag || '' }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.head }}
          persist-credentials: false
          # Always from a clean checkout, the Mac mini's runner too: its work folder is shared with pull requests'
          # parity jobs, and nothing they leave may end up in a launcher release (target/ is rebuilt from scratch).
          clean: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      - name: Metal shaders compiled now, or at run time without the Metal toolchain
        # GPUI compiles its Metal shaders when it builds; the Mac mini has Xcode without the Metal toolchain
        # (xcodebuild -downloadComponent MetalToolchain), so there they are compiled when the launcher starts.
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain on this runner: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui_platform/runtime_shaders" >> "$GITHUB_ENV"
          fi
      - run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        run: python ../tools/check_pe_arch.py "${{ matrix.pe_arch }}" "$BIN/${{ matrix.binary }}"
      - name: The version is the release's
        if: ${{ !(runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc') }}
        run: |
          out=$("$BIN/${{ matrix.binary }}" --version)
          echo "$out"
          expected="${HORIZON_LAUNCHER_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          [[ "$out" == "horizon-launcher $expected" ]] || { echo "::error::expected horizon-launcher $expected"; exit 1; }
      - name: Only system libraries
        run: |
          file="$BIN/${{ matrix.binary }}"
          case "$RUNNER_OS" in
            Windows) python ../tools/check_imports.py "$file" ;;
            macOS) others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
                   [[ -z "$others" ]] || { echo "::error::links $others"; exit 1; } ;;
          esac
      - name: Smoke test
        if: ${{ !(runner.os == 'Windows' && matrix.target == 'aarch64-pc-windows-msvc') }}
        env:
          HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
          HORIZON_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export HORIZON_LAUNCHER_HOME="${RUNNER_TEMP//\\//}/horizon-launcher-smoke"
          export HORIZON_HOME="$HORIZON_LAUNCHER_HOME/game"
          rm -rf "$HORIZON_LAUNCHER_HOME"
          launcher="$PWD/$BIN/${{ matrix.binary }}"
          # GitHub's API rate-limits shared runner addresses now and then: try a few times.
          retry() { for i in 1 2 3 4; do "$@" && return 0; sleep $((i * 15)); done; return 1; }
          retry "$launcher" versions
          "$launcher" links --json
          # The Intel Mac launcher can come out before any game build has its asset (#1161): then there is nothing
          # to install yet. Only that entry skips, and only on a version list that parsed and had no build here
          # (exit 3); a launcher or a script that fails still fails the step. The Windows ARM64 launcher always has
          # one: it installs the x64 build where a release has no ARM64 one (backend.rs, GAME_FALLBACK).
          if [[ "${{ matrix.name }}" == macos-x64 ]]; then
            versions=$(retry "$launcher" --json versions)
            no_build='import json, sys; sys.exit(3 if not any(r["available_here"] for r in json.load(sys.stdin)) else 0)'
            status=0
            python3 -c "$no_build" <<<"$versions" || status=$?
            if [[ $status == 3 ]]; then
              echo "::warning::No game build has an asset for ${{ matrix.name }} yet: install not tested"
              rm -rf "$HORIZON_LAUNCHER_HOME"
              exit 0
            fi
            [[ $status == 0 ]] || exit $status
          fi
          retry "$launcher" install latest
          "$launcher" versions --installed
          # `install latest` is the Nightly since #3342 (versions/nightly-<date>-<commit>), a vX.Y.Z before.
          clients=("$HORIZON_LAUNCHER_HOME"/versions/*/horizon-client*)
          client="${clients[0]}"
          echo "installed client: $client"
          [[ -f "$client" ]] || { echo "::error::no game installed under versions/"; exit 1; }
          # The game's Linux build is the game's to keep portable (release.yml checks it): a
          # release linked to a Nix store is a warning here, not a broken launcher.
          soft() { if [[ "$RUNNER_OS" == "Linux" ]]; then "$@" || echo "::warning::$* failed"; else "$@"; fi; }
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if ! python ../tools/check_pe_arch.py "${{ matrix.pe_arch }}" "$client"; then
              # A Nightly without an ARM64 build: the ARM64 launcher installs the x64 one (backend.rs, GAME_FALLBACK).
              [[ "${{ matrix.pe_arch }}" == arm64 ]] && python ../tools/check_pe_arch.py x64 "$client" || exit 1
              echo "::warning::the latest game has no ARM64 build: the launcher installed the x64 one"
            fi
            python ../tools/check_imports.py "$client"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            soft python3 ../tools/check_imports.py "$client"
          fi
          # The client starts: --help prints before any window or GPU is needed.
          help() { "$client" --help > "$RUNNER_TEMP/help.txt" 2>&1 && head -3 "$RUNNER_TEMP/help.txt" && grep -q -- '--resources' "$RUNNER_TEMP/help.txt"; }
          soft help
          # The per-user Windows setup: the same binary under the setup's name installs into a scratch
          # folder, and the copy it installs uninstalls itself. HKCU of the runner only.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            setup="$RUNNER_TEMP/setup-smoke"
            cp "$launcher" "$RUNNER_TEMP/horizon-launcher-setup.exe"
            "$RUNNER_TEMP/horizon-launcher-setup.exe" setup --quiet --dir "$setup"
            installed="$setup/Horizon Launcher/horizon-launcher.exe"
            [[ -f "$installed" ]] || { echo "::error::the setup copied no launcher"; exit 1; }
            "$installed" uninstall --quiet
            [[ ! -f "$installed" ]] || { echo "::error::uninstall left the launcher"; exit 1; }
            rm -rf "$setup"
          fi
          rm -rf "$HORIZON_LAUNCHER_HOME"
      - name: The signing keychain, unlocked
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: ../packaging/macos/keychain.sh unlock
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          rm -rf dist out && mkdir -p out
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Horizon.app, zipped (self-update) and in a .dmg (installer), signed (and notarized with
            # Developer ID): packaging/macos.
            python3 -m venv "$RUNNER_TEMP/dmg" && "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
            version=${HORIZON_LAUNCHER_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}
            DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" ../packaging/macos/package.sh "$BIN/${{ matrix.binary }}" "$version" out ${{ matrix.mac_arch }}
            rm -rf out/Horizon.app
          else
            version=${HORIZON_LAUNCHER_VERSION:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              # The .tar.gz below is what the launcher updates itself from; the AppImage is what a
              # player downloads and double-clicks, and it replaces itself instead
              # (packaging/linux/appimage.sh, launcher/src/backend.rs).
              ../packaging/linux/appimage.sh "$BIN/${{ matrix.binary }}" "$version" out
            fi
            mkdir -p dist
            cp "$BIN/${{ matrix.binary }}" dist/
            if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
              (cd dist && tar czf ../out/${{ matrix.asset }} ${{ matrix.binary }})
            else
              (cd dist && 7z a ../out/${{ matrix.asset }} ${{ matrix.binary }})
            fi
          fi
          ls -l out
      - name: Setup exe (Windows)
        # The launcher's binary under another name: started with no arguments it shows the per-user
        # installer instead of Home (launcher/src/installer.rs). Its name is what makes it the setup,
        # so the ZIP's copy stays the launcher. Both go into the release's signed SHA256SUMS.
        if: runner.os == 'Windows'
        run: cp "$BIN/${{ matrix.binary }}" "out/${{ matrix.setup_asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: launcher/out/*
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != ''
        run: ../packaging/macos/keychain.sh lock

  sign:
    needs: [decide, build]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This fork uses its own persistent launcher-only key, separate from Horizon's game release key.
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: horizon-launcher-*
          merge-multiple: true
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.LAUNCHER_RELEASE_SIGNING_KEY }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            echo "::error::Set the LAUNCHER_RELEASE_SIGNING_KEY Actions secret to the base64 Ed25519 private key for launcher-release-keys.txt."
            exit 1
          fi
          bash tools/ci/sign_release.sh "$TAG" dist/horizon-launcher-*
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3
  release:
    needs: [decide, build, sign]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADDED: ${{ inputs.added }}
          RELEASE_REMOVED: ${{ inputs.removed }}
          RELEASE_FIXED: ${{ inputs.fixed }}
        run: |
          overrides=()
          [[ -z "$RELEASE_ADDED" ]] || overrides+=(--added "$RELEASE_ADDED")
          [[ -z "$RELEASE_REMOVED" ]] || overrides+=(--removed "$RELEASE_REMOVED")
          [[ -z "$RELEASE_FIXED" ]] || overrides+=(--fixed "$RELEASE_FIXED")
          python3 tools/release_train.py notes --kind launcher --tag "${{ needs.decide.outputs.tag }}" \
            --head "${{ needs.decide.outputs.head }}" --out notes "${overrides[@]}" > /dev/null
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The signature, checked as launchers check it
        run: |
          key=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            key+=(--key "$line")
          done < crates/horizon-release-sign/launcher-release-keys.txt
          if [[ ${#key[@]} -eq 0 ]]; then
            echo "::error::launcher-release-keys.txt has no trusted launcher release keys."
            exit 1
          fi
          cargo run --locked --quiet -p horizon-release-sign -- verify \
            --tag "${{ needs.decide.outputs.tag }}" "${key[@]}" --publishing dist
      - name: List every platform build
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          asset() {
            local file=$1
            if [[ -f "dist/$file" ]]; then
              printf -- '- [%s](https://github.com/invisbleia/horizon-cracked/releases/download/%s/%s)\n' "$file" "$TAG" "$file"
            else
              printf -- '- `%s` — not built\n' "$file"
            fi
          }
          {
            echo '### Builds'
            echo
            echo '#### Linux'
            asset horizon-launcher-linux-x86_64.tar.gz
            asset horizon-launcher-linux-x86_64.AppImage
            echo
            echo '#### macOS — Apple Silicon'
            asset horizon-launcher-macos-arm64.zip
            asset horizon-launcher-macos-arm64.dmg
            echo
            echo '#### macOS — Intel'
            asset horizon-launcher-macos-x64.zip
            asset horizon-launcher-macos-x64.dmg
            echo
            echo '#### Windows — x64'
            asset horizon-launcher-windows-x64.zip
            asset horizon-launcher-setup.exe
            echo
            echo '#### Windows — ARM64'
            asset horizon-launcher-windows-arm64.zip
            asset horizon-launcher-setup-arm64.exe
          } >> notes/body.md
      # Never marked latest: Horizon's own releases stay the repository's latest.
      - name: The Windows ARM64 launcher, if it built
        # Its build may fail without holding the release (continue-on-error): the release then has no ARM64
        # files, and ARM64 launchers stay on their version until one has (backend::launcher_update_from).
        run: |
          for file in horizon-launcher-windows-arm64.zip horizon-launcher-setup-arm64.exe; do
            [[ -f "dist/$file" ]] || echo "::warning::$file is missing: this release goes out without it"
          done
      - name: Publish ${{ needs.decide.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          signature=(); [[ -f dist/SHA256SUMS.sig ]] && signature=(dist/SHA256SUMS.sig)
          gh release create "$TAG" --target "${{ needs.decide.outputs.head }}" --title "$(cat notes/title.txt)" \
            --notes-file notes/body.md --latest=false dist/horizon-launcher-* dist/SHA256SUMS "${signature[@]}"
      - name: Release summary
        run: |
          {
            echo "## Published $(cat notes/title.txt)"
            echo
            cat notes/body.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: launcher-release-notes
          path: notes/
          retention-days: 3
